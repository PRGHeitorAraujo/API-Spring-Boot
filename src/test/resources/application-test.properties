# Perfil usado automaticamente pelo ./gradlew test (ver build.gradle)
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Chave fake para o contexto subir sem OpenAI; os testes *IT usam a chave real se ela existir
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
